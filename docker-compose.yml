services:
  postgres:
    image: postgres:17-alpine
    container_name: book-bazar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookbazar
      POSTGRES_PASSWORD: bookbazar_dev_password
      POSTGRES_DB: bookbazar
    ports:
      - "5432:5432"
    volumes:
      - book_bazar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookbazar -d bookbazar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: book-bazar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - book_bazar_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  book_bazar_postgres_data:
  book_bazar_redis_data:
