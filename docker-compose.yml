services:
  mongodb:
    image: mongo:8.0
    container_name: book-bazar-mongodb
    restart: unless-stopped
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - book_bazar_mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 15

  mongodb-setup:
    image: mongo:8.0
    container_name: book-bazar-mongodb-setup
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/bash
      - -c
      - |
        mongosh "mongodb://mongodb:27017/admin" --quiet --eval '
          try {
            rs.status();
            print("Replica set already initialized");
          } catch (error) {
            rs.initiate({
              _id: "rs0",
              members: [
                { _id: 0, host: "127.0.0.1:27017" }
              ]
            });
            print("Replica set initialization requested");
          }
        '

volumes:
  book_bazar_mongodb_data:
